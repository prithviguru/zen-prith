<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zen — Meditation Tracker</title>
<meta name="theme-color" content="#0e1113" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zen" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e1113;
    --surface: #15191c;
    --surface-2: #1b2024;
    --line: rgba(255, 255, 255, 0.06);
    --text: #e8e4dc;
    --text-dim: #8a877f;
    --text-faint: #55534d;
    --accent: #a3b18a;
    --accent-soft: rgba(163, 177, 138, 0.14);
    --accent-glow: rgba(163, 177, 138, 0.35);
    /* Rating palette: separated enough to read at dot size — green, amber,
       terracotta — while staying muted against the dark page. */
    --r-good: #9ec27b;
    --r-okay: #e0b544;
    --r-rough: #d1675a;
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(163, 177, 138, 0.07), transparent);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }

  .app {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---------- header ---------- */
  header { text-align: center; }

  .breath {
    width: 10px;
    height: 10px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--accent);
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 var(--accent-glow); opacity: 0.7; }
    50%      { transform: scale(1.35); box-shadow: 0 0 24px 8px var(--accent-glow); opacity: 1; }
  }

  .greeting {
    display: block;
    margin: 0 auto;
    padding: 2px 6px;
    background: none;
    border: none;
    color: var(--text);
    max-width: 100%;
    font-family: "Cormorant Garamond", Georgia, serif;
    /* Scales down on narrow screens so a long name still fits on one line. */
    font-size: clamp(23px, 7.4vw, 34px);
    font-weight: 500;
    letter-spacing: 0.02em;
    line-height: 1.15;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .greeting:hover { opacity: 0.75; }

  .tagline {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  /* Flex column rather than plain block: a <button> tile would otherwise
     center its content vertically and sit lower than the <div> tiles. */
  .stat {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 8px 14px;
    text-align: center;
  }

  /* The weekly-goal tile is the same tile, but tappable to edit the goal. */
  .stat-btn {
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.2s;
  }
  .stat-btn:hover { background: var(--surface-2); }
  .stat-btn.met {
    border-color: rgba(163, 177, 138, 0.4);
    box-shadow: 0 0 20px rgba(163, 177, 138, 0.1);
  }

  .week-pencil {
    position: absolute;
    top: 10px;
    right: 10px;
    color: var(--text-faint);
    transition: color 0.2s;
  }
  .stat-btn:hover .week-pencil { color: var(--text-dim); }

  .stat b {
    display: block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 30px;
    font-weight: 500;
    /* Fixed height and line-height so the smaller "/5" glyphs can't stretch
       this row — every tile's number occupies the same box and the labels
       line up across all three. */
    line-height: 33px;
    height: 33px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  /* "3/5" — the goal reads smaller and dimmer than the count. */
  .stat b i,
  .stat b em {
    font-style: normal;
    font-size: 19px;
    margin-left: 1px;
  }
  .stat b i { color: var(--text-faint); }
  .stat b em { color: var(--text-dim); }

  /* Direct child only — the count inside <b> is a span too. */
  .stat > span {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- begin session ---------- */
  .begin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 15px;
    background: var(--accent-soft);
    border: 1px solid rgba(163, 177, 138, 0.28);
    border-radius: var(--radius);
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .begin:hover { background: rgba(163, 177, 138, 0.2); }
  .begin:active { transform: scale(0.985); }

  /* ---------- timer / stopwatch picker ---------- */
  .mode-label {
    margin: -6px 0 9px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .mode-label + .lens { margin-bottom: 18px; }

  .lens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .stopwatch {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 15px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .stopwatch:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.16); }
  .stopwatch:active { transform: scale(0.98); }

  .len {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 6px 11px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .len b {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    line-height: 1;
    color: var(--accent);
  }
  .len:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.16); }
  .len:active { transform: scale(0.96); }

  /* ---------- running timer ---------- */
  .timer-view {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 46px;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
    background: var(--bg);
    background-image: radial-gradient(ellipse 70% 45% at 50% 40%, rgba(163, 177, 138, 0.1), transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .timer-view.open { opacity: 1; pointer-events: auto; }

  .timer-stage {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-bg, .ring-fg { fill: none; stroke-width: 2; }
  .ring-bg { stroke: rgba(255, 255, 255, 0.07); }
  .ring-fg {
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-dasharray: 691.15;
    stroke-dashoffset: 691.15;
    opacity: 0.75;
    transition: stroke-dashoffset 0.3s linear;
  }
  .ring-fg.hidden { display: none; }

  .timer-orb {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(163, 177, 138, 0.2), rgba(163, 177, 138, 0.03) 70%);
    animation: breathe 6s ease-in-out infinite;
  }

  .timer-readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .timer-time {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 52px;
    font-weight: 500;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .timer-mode {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .timer-end {
    padding: 13px 34px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .timer-end:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.2); }

  /* ---------- calendar ---------- */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px 22px;
  }

  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .cal-title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .cal-title em {
    font-style: italic;
    color: var(--text-dim);
    margin-left: 6px;
  }

  .nav-btn {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }

  .nav-btn:hover {
    color: var(--text);
    border-color: rgba(255, 255, 255, 0.18);
    background: var(--surface-2);
  }

  /* Seven days, then a narrow column tallying that week — every row of a
     month grid is already a week, so the history has somewhere to live. */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr) 42px;
    gap: 6px 4px;
  }

  .wk {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 6px;
    border-left: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  /* The goal reads lighter than the count, so the number still leads. */
  .wk i { font-style: normal; opacity: 0.5; }
  .wk.met { color: var(--accent); }

  .wk-head { margin-left: 6px; }

  .dow {
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--text-faint);
    padding-bottom: 8px;
  }

  .day {
    position: relative;
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.15s;
  }

  .day:hover { background: var(--surface-2); }
  .day:active { transform: scale(0.9); }

  .day.blank { cursor: default; }
  .day.blank:hover { background: transparent; }

  .day.future {
    color: var(--text-faint);
    cursor: default;
  }
  .day.future:hover { background: transparent; }
  .day.future:active { transform: none; }

  /* Today is marked by its number, not a dot — the dot slot belongs to the
     rating now. */
  .day.today { color: var(--accent); }

  /* Every logged day is the same quiet ring; the rating is a small coloured
     dot inside it, so the calendar stays calm at a glance. */
  .day.done {
    font-weight: 500;
    box-shadow: inset 0 0 0 1.5px rgba(232, 228, 220, 0.22);
  }
  .day.done:hover { background: rgba(232, 228, 220, 0.07); }

  .day.r-good::after,
  .day.r-okay::after,
  .day.r-rough::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 4.5px;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .day.r-good::after  { background: var(--r-good); }
  .day.r-okay::after  { background: var(--r-okay); }
  .day.r-rough::after { background: var(--r-rough); }

  .day.pop { animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes pop {
    0%   { transform: scale(0.7); }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ---------- rating sheet ---------- */
  /* A ring with the rating dot inside, echoing the calendar exactly. */
  .dot-sw {
    position: relative;
    display: block;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px rgba(232, 228, 220, 0.22);
  }
  .dot-sw::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  /* Same wash as the calendar circles, so legend and days always agree. */
  .sw-good  { color: var(--r-good); }
  .sw-okay  { color: var(--r-okay); }
  .sw-rough { color: var(--r-rough); }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 7, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 10;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 105%);
    width: 100%;
    max-width: 420px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(18px + env(safe-area-inset-bottom));
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0.35, 1);
    z-index: 11;
    touch-action: pan-y;
  }
  .sheet.open { transform: translate(-50%, 0); }
  /* While a finger is on it, follow the drag exactly — no easing. */
  .sheet.dragging { transition: none; }

  .sheet-handle {
    width: 36px;
    height: 4px;
    margin: -8px auto 14px;
    border-radius: 2px;
    background: rgba(232, 228, 220, 0.18);
  }

  .sheet-date {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .sheet-title {
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 24px;
    font-weight: 500;
    margin: 4px 0 18px;
  }

  .opts { display: flex; gap: 10px; }

  .opt {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 8px 13px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .opt:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.16); }
  .opt:active { transform: scale(0.96); }
  .opt.selected {
    border-color: rgba(163, 177, 138, 0.6);
    color: var(--text);
    background: rgba(163, 177, 138, 0.07);
  }

  .sheet-remove {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: color 0.2s;
  }
  .sheet-remove:hover { color: #c99a8f; }



  /* ---------- session length ---------- */
  .dur-label {
    margin: -10px 0 9px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .dur-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-bottom: 20px;
  }

  .dur {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .dur:hover { color: var(--text-dim); border-color: rgba(255, 255, 255, 0.14); }
  .dur:active { transform: scale(0.94); }
  .dur.selected {
    border-color: rgba(163, 177, 138, 0.55);
    background: rgba(163, 177, 138, 0.1);
    color: var(--accent);
  }

  .dur-plus { min-width: 42px; font-size: 15px; line-height: 1; }

  .dur-input {
    width: 82px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px; /* matches the chips */
    letter-spacing: 0.03em;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .dur-input::placeholder {
    color: var(--text-faint);
    font-style: italic;
  }
  /* iOS zooms the page when a focused field is under 16px, so grow it for
     the moment it's being typed into — at rest it sits level with the chips. */
  .dur-input:focus {
    border-color: rgba(163, 177, 138, 0.5);
    font-size: 16px;
  }
  .dur-input.selected {
    border-color: rgba(163, 177, 138, 0.55);
    background: rgba(163, 177, 138, 0.1);
    color: var(--accent);
  }
  .dur-input::-webkit-outer-spin-button,
  .dur-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* ---------- goal sheet ---------- */
  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 6px 0 4px;
  }

  .step-btn {
    width: 44px;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .step-btn:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.18); }
  .step-btn:active { transform: scale(0.92); }

  .goal-num {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 46px;
    font-weight: 500;
    color: var(--accent);
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .goal-done {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    background: var(--accent-soft);
    border: none;
    border-radius: 14px;
    color: var(--accent);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .goal-done:hover { background: rgba(163, 177, 138, 0.22); }

  /* ---------- name sheet ---------- */
  .name-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px; /* 16px keeps iOS from zooming on focus */
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-input::placeholder { color: var(--text-faint); }
  .name-input:focus { border-color: rgba(163, 177, 138, 0.5); }

  /* ---------- footer legend ---------- */
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }

  footer span { display: inline-flex; align-items: center; gap: 7px; }
  /* In the legend the ring would be noise at this size — show just the dot. */
  footer .dot-sw {
    width: 8px;
    height: 8px;
    box-shadow: none;
    background: currentColor;
  }
  footer .dot-sw::after { display: none; }

  @media (max-width: 380px) {
    .stat b { font-size: 26px; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <div class="breath" aria-hidden="true"></div>
      <button class="greeting" id="greeting" aria-haspopup="dialog">Zen</button>
      <p class="tagline">One breath at a time</p>
    </header>

    <section class="stats" aria-label="Statistics">
      <button class="stat stat-btn" id="week-card" aria-haspopup="dialog">
        <svg class="week-pencil" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <b><span id="week-count">0</span><i>/</i><em id="week-goal">5</em></b>
        <span id="week-label">This week</span>
      </button>
      <div class="stat"><b id="stat-month">0</b><span>This month</span></div>
      <div class="stat"><b id="stat-good">0</b><span>Good days</span></div>
    </section>

    <button class="begin" id="begin-btn">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      Begin session
    </button>

    <section class="calendar" aria-label="Calendar">
      <div class="cal-head">
        <button class="nav-btn" id="prev" aria-label="Previous month">&#8249;</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="nav-btn" id="next" aria-label="Next month">&#8250;</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <footer aria-label="Rating legend">
      <span><i class="dot-sw sw-good"></i>Good</span>
      <span><i class="dot-sw sw-okay"></i>Okay</span>
      <span><i class="dot-sw sw-rough"></i>Not great</span>
    </footer>
  </main>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="sheet-date" id="sheet-date"></p>
    <h2 class="sheet-title" id="sheet-title">How was your session today?</h2>
    <p class="dur-label">How long?</p>
    <div class="dur-row" id="dur-row"></div>
    <div class="opts">
      <button class="opt" data-rating="good"><i class="dot-sw sw-good"></i>Good</button>
      <button class="opt" data-rating="okay"><i class="dot-sw sw-okay"></i>Okay</button>
      <button class="opt" data-rating="rough"><i class="dot-sw sw-rough"></i>Not great</button>
    </div>
    <button class="goal-done" id="sheet-save">Save</button>
    <button class="sheet-remove" id="sheet-remove">Remove this day</button>
  </div>

  <div class="sheet" id="goal-sheet" role="dialog" aria-modal="true" aria-labelledby="goal-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="sheet-date">Weekly goal</p>
    <h2 class="sheet-title" id="goal-title">Sessions per week</h2>
    <div class="stepper">
      <button class="step-btn" id="goal-minus" aria-label="Decrease goal">&minus;</button>
      <span class="goal-num" id="goal-num">5</span>
      <button class="step-btn" id="goal-plus" aria-label="Increase goal">+</button>
    </div>
    <button class="goal-done" id="goal-done">Done</button>
  </div>

  <div class="sheet" id="timer-sheet" role="dialog" aria-modal="true" aria-labelledby="timer-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 class="sheet-title" id="timer-title">Begin a session</h2>
    <p class="mode-label">Timer &mdash; count down</p>
    <div class="lens">
      <button class="len" data-min="5"><b>5</b>min</button>
      <button class="len" data-min="10"><b>10</b>min</button>
      <button class="len" data-min="15"><b>15</b>min</button>
      <button class="len" data-min="20"><b>20</b>min</button>
      <button class="len" data-min="30"><b>30</b>min</button>
      <button class="len" data-min="45"><b>45</b>min</button>
    </div>
    <p class="mode-label">Stopwatch &mdash; count up</p>
    <button class="stopwatch" id="stopwatch-btn">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 1h6"/></svg>
      Sit for as long as you like
    </button>
  </div>

  <!-- A media element, not the Web Audio API: iOS silences Web Audio when the
       ring/silent switch is on, but plays media elements through it. -->
  <audio id="bell" src="bell.wav" preload="auto" playsinline></audio>

  <div class="timer-view" id="timer-view" role="dialog" aria-modal="true" aria-label="Meditation timer">
    <div class="timer-stage">
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring-bg" cx="120" cy="120" r="110" />
        <circle class="ring-fg" id="ring-fg" cx="120" cy="120" r="110" />
      </svg>
      <div class="timer-orb" aria-hidden="true"></div>
      <div class="timer-readout">
        <span class="timer-time" id="timer-time">0:00</span>
        <span class="timer-mode" id="timer-mode"></span>
      </div>
    </div>
    <button class="timer-end" id="timer-end">End session</button>
  </div>

  <div class="sheet" id="name-sheet" role="dialog" aria-modal="true" aria-labelledby="name-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="sheet-date" id="name-kicker">Welcome</p>
    <h2 class="sheet-title" id="name-title">What should we call you?</h2>
    <input class="name-input" id="name-input" type="text" maxlength="24"
           placeholder="Your name" autocomplete="given-name" enterkeyhint="done" />
    <button class="goal-done" id="name-save">Begin</button>
    <button class="sheet-remove" id="name-skip">Skip</button>
  </div>

<script>
(() => {
  const STORAGE_KEY = "zen-meditation-log";
  const LEGACY_KEY = "zen-meditation-days";
  const GOAL_KEY = "zen-weekly-goal";
  const NAME_KEY = "zen-name";
  const TIMER_KEY = "zen-timer";
  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  const DOWS = ["S","M","T","W","T","F","S"];
  const LABELS = { good: "good", okay: "okay", rough: "not great" };

  const grid = document.getElementById("grid");
  const title = document.getElementById("cal-title");

  // log maps ISO date -> rating: "good" | "okay" | "rough"
  let log = load();
  let goal = loadGoal();
  let name = localStorage.getItem(NAME_KEY) || "";
  let view = new Date();
  view.setDate(1);
  let sheetKey = null;   // date currently open in the rating sheet
  let selMinutes = null; // length chosen in the sheet, null = not recorded
  let selRating = null;  // rating chosen in the sheet, null = none
  let durExpanded = false; // "More" tapped: show the full set of lengths
  let justRated = null;  // date to pop-animate on next render

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        // v2 stored a bare rating string; v3 stores { rating, minutes }.
        const parsed = JSON.parse(raw) || {};
        let changed = false;
        for (const k in parsed) {
          if (typeof parsed[k] === "string") {
            parsed[k] = { rating: parsed[k] };
            changed = true;
          }
        }
        if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        return parsed;
      }
      // Migrate v1 data: unrated marked days become "okay".
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
      if (Array.isArray(legacy) && legacy.length) {
        const migrated = {};
        for (const d of legacy) migrated[d] = { rating: "okay" };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch {}
    return {};
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  }

  function key(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }

  function todayKey() {
    const t = new Date();
    return key(t.getFullYear(), t.getMonth(), t.getDate());
  }

  function loadGoal() {
    const g = parseInt(localStorage.getItem(GOAL_KEY), 10);
    return g >= 1 && g <= 7 ? g : 5;
  }

  function saveGoal() {
    localStorage.setItem(GOAL_KEY, String(goal));
  }

  // Sessions in the current week (Sunday–Saturday, matching the calendar).
  function weekCount() {
    const t = new Date();
    const start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay());
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (log[key(d.getFullYear(), d.getMonth(), d.getDate())]) n++;
    }
    return n;
  }

  function render() {
    const y = view.getFullYear(), m = view.getMonth();
    const now = new Date();
    const thisMonth = now.getFullYear() === y && now.getMonth() === m;

    title.innerHTML = `${MONTHS[m]} <em>${y}</em>`;
    grid.innerHTML = "";

    for (const d of DOWS) {
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      grid.appendChild(el);
    }
    const wkHead = document.createElement("div");
    wkHead.className = "dow wk-head";
    wkHead.textContent = "WK";
    grid.appendChild(wkHead);

    const firstDow = new Date(y, m, 1).getDay();
    const total = new Date(y, m + 1, 0).getDate();
    let cells = 0; // days placed so far, to know when a week row is full

    for (let i = 0; i < firstDow; i++) {
      const el = document.createElement("div");
      el.className = "day blank";
      grid.appendChild(el);
      cells++;
    }

    for (let d = 1; d <= total; d++) {
      const el = document.createElement("button");
      const k = key(y, m, d);
      const entry = log[k];
      const rating = entry && entry.rating;
      const isFuture = new Date(y, m, d) > now;
      el.className = "day";
      el.textContent = d;
      if (k === todayKey()) el.classList.add("today");
      if (entry) el.classList.add("done", rating ? "r-" + rating : "r-none");
      if (k === justRated) {
        el.classList.add("pop");
        el.addEventListener("animationend", () => el.classList.remove("pop"), { once: true });
      }
      if (isFuture) {
        el.classList.add("future");
        el.disabled = true;
        el.setAttribute("aria-label", `${MONTHS[m]} ${d} — future`);
      } else {
        const mins = entry && entry.minutes ? `, ${entry.minutes} minutes` : "";
        const state = entry ? "meditated" + (rating ? ", " + LABELS[rating] : "") + mins : "not marked";
        el.setAttribute("aria-label", `${MONTHS[m]} ${d} — ${state}`);
        el.addEventListener("click", () => openSheet(k, `${MONTHS[m]} ${d}, ${y}`));
      }
      grid.appendChild(el);
      cells++;
      if (cells % 7 === 0) grid.appendChild(weekCell(y, m, d));
    }
    // Pad the last row so its tally lands in the week column, not mid-row.
    if (cells % 7) {
      for (let i = cells % 7; i < 7; i++) {
        const el = document.createElement("div");
        el.className = "day blank";
        grid.appendChild(el);
      }
      grid.appendChild(weekCell(y, m, total));
    }
    justRated = null;

    updateStats(y, m);
  }

  // Sessions logged in the Sunday–Saturday week containing the given day.
  // Counts the real week, including days that fall in a neighbouring month,
  // so a row spanning two months still reports the truth.
  function weekTally(y, m, d) {
    const day = new Date(y, m, d);
    const start = new Date(y, m, d - day.getDay());
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const c = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (log[key(c.getFullYear(), c.getMonth(), c.getDate())]) n++;
    }
    return { n, start };
  }

  function weekCell(y, m, d) {
    const el = document.createElement("div");
    el.className = "wk";
    const { n, start } = weekTally(y, m, d);
    // Weeks that haven't begun have nothing to say yet.
    if (start > new Date()) return el;
    el.innerHTML = `${n}<i>/${goal}</i>`;
    if (n >= goal) el.classList.add("met");
    el.setAttribute("aria-label",
      `Week of ${MONTHS[start.getMonth()]} ${start.getDate()}: ${n} of ${goal} sessions`);
    return el;
  }

  function updateStats(y, m) {
    const prefix = `${y}-${String(m + 1).padStart(2, "0")}`;
    let monthCount = 0, goodCount = 0;
    for (const k in log) {
      if (!k.startsWith(prefix)) continue;
      monthCount++;
      if (log[k].rating === "good") goodCount++;
    }
    document.getElementById("stat-month").textContent = monthCount;
    document.getElementById("stat-good").textContent = goodCount;

    // "This week" only means something in the month you're actually in. Look
    // at another month and the tile answers the question that month can
    // answer: how many of its weeks hit the goal.
    const now = new Date();
    const viewingNow = now.getFullYear() === y && now.getMonth() === m;
    const count = document.getElementById("week-count");
    const slash = count.nextElementSibling;
    const denom = document.getElementById("week-goal");
    const card = document.getElementById("week-card");
    let met;

    if (viewingNow) {
      const wc = weekCount();
      met = wc >= goal;
      count.textContent = wc;
      slash.textContent = "/";
      denom.textContent = goal;
      document.getElementById("week-label").textContent = "This week";
      card.setAttribute("aria-label", `This week: ${wc} of ${goal} sessions. Edit weekly goal.`);
    } else {
      const { hit, started } = monthWeeks(y, m);
      met = started > 0 && hit === started;
      count.textContent = started ? hit : "—";
      slash.textContent = started ? "/" : "";
      denom.textContent = started ? started : "";
      document.getElementById("week-label").textContent = "Weeks met";
      card.setAttribute("aria-label",
        started
          ? `${MONTHS[m]}: ${hit} of ${started} weeks met the goal. Edit weekly goal.`
          : `${MONTHS[m]}: no weeks yet. Edit weekly goal.`);
    }
    card.classList.toggle("met", met);
  }

  // How many of a month's weeks hit the goal, out of those that have begun.
  function monthWeeks(y, m) {
    const total = new Date(y, m + 1, 0).getDate();
    const firstDow = new Date(y, m, 1).getDay();
    const now = new Date();
    let hit = 0, started = 0;
    for (let d = 1 - firstDow; d <= total; d += 7) {
      if (new Date(y, m, d) > now) break;
      started++;
      if (weekTally(y, m, d).n >= goal) hit++;
    }
    return { hit, started };
  }

  /* ---------- rating sheet ---------- */
  const sheet = document.getElementById("sheet");
  const backdrop = document.getElementById("backdrop");
  const removeBtn = document.getElementById("sheet-remove");

  function openSheet(k, label, presetMinutes) {
    sheetKey = k;
    const e = log[k];
    selMinutes = presetMinutes != null ? presetMinutes : (e && e.minutes) || null;
    durExpanded = false;
    document.getElementById("sheet-date").textContent = label;
    selRating = (e && e.rating) || null;
    markOptSelection();
    renderDurs();
    removeBtn.style.display = e ? "block" : "none";
    backdrop.classList.add("open");
    sheet.classList.add("open");
  }

  /* ---------- session length ---------- */
  // Three common lengths up front; everything else is a tap away under "More".
  const DUR_MAIN = [10, 15, 30];
  const DUR_ALL = [5, 10, 15, 20, 25, 30, 45, 60];

  function renderDurs() {
    const row = document.getElementById("dur-row");
    row.innerHTML = "";
    const base = durExpanded ? DUR_ALL : DUR_MAIN;
    // A length set elsewhere (or by a future timer) may not be in the shown
    // set; keep it visible rather than silently dropping it.
    const vals = !selMinutes || base.includes(selMinutes) ? base : [selMinutes, ...base];

    for (const v of vals) row.appendChild(durChip(`${v} min`, v));

    if (durExpanded) {
      row.appendChild(durInput());
    } else {
      const plus = document.createElement("button");
      plus.className = "dur dur-plus";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "More lengths");
      plus.addEventListener("click", () => {
        durExpanded = true;
        renderDurs();
      });
      row.appendChild(plus);
    }
    markDurSelection();
  }

  function durChip(label, v) {
    const b = document.createElement("button");
    b.className = "dur";
    b.textContent = label;
    b.dataset.min = v;
    // Tapping the chosen length again clears it — no separate "none" chip.
    b.addEventListener("click", () => setDuration(v === selMinutes ? null : v));
    return b;
  }

  // Typing a length lives in the expanded row rather than behind another tap.
  function durInput() {
    const input = document.createElement("input");
    input.type = "number";
    input.inputMode = "numeric";
    input.className = "dur-input";
    input.min = "1";
    input.max = "600";
    input.placeholder = "Custom";
    input.setAttribute("aria-label", "Length in minutes");
    if (selMinutes && !DUR_ALL.includes(selMinutes)) input.value = selMinutes;

    // "change" fires once, on Enter or on blur — no double-commit to guard.
    input.addEventListener("change", () => {
      if (input.value === "") return;
      const v = Math.round(Number(input.value));
      if (v >= 1 && v <= 600) setDuration(v);
      else input.value = selMinutes && !DUR_ALL.includes(selMinutes) ? selMinutes : "";
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        input.blur();
      } else if (e.key === "Escape") {
        e.stopPropagation(); // don't let Escape close the whole sheet
        input.value = "";
        input.blur();
      }
    });
    return input;
  }

  // Repaint selection in place. Rebuilding the row here would tear down the
  // element a tap is landing on — a rating tapped straight after typing a
  // length would be swallowed.
  function markDurSelection() {
    const row = document.getElementById("dur-row");
    let onChip = false;
    row.querySelectorAll(".dur").forEach((el) => {
      const v = el.dataset.min ? Number(el.dataset.min) : null;
      const on = v !== null && v === selMinutes;
      el.classList.toggle("selected", on);
      if (on) onChip = true;
    });
    const input = row.querySelector(".dur-input");
    if (input) {
      input.classList.toggle("selected", !!selMinutes && !onChip);
      if (onChip) input.value = "";
    }
  }

  function setDuration(v) {
    selMinutes = v;
    markDurSelection();
  }

  function closeSheet() {
    sheetKey = null;
    backdrop.classList.remove("open");
    sheet.classList.remove("open");
    goalSheet.classList.remove("open");
    nameSheet.classList.remove("open");
    timerSheet.classList.remove("open");
  }

  function markOptSelection() {
    document.querySelectorAll(".opt").forEach((b) =>
      b.classList.toggle("selected", b.dataset.rating === selRating)
    );
  }

  // Nothing in the sheet commits on its own — the rating and the length are
  // both just selections until Save, and dismissing throws them away.
  document.querySelectorAll(".opt").forEach((b) =>
    b.addEventListener("click", () => {
      selRating = selRating === b.dataset.rating ? null : b.dataset.rating;
      markOptSelection();
    })
  );

  // Saving with nothing chosen still logs the day: a session counts on its
  // own, with or without an opinion about how it went.
  document.getElementById("sheet-save").addEventListener("click", () => {
    if (!sheetKey) return;
    const e = {};
    if (selRating) e.rating = selRating;
    if (selMinutes) e.minutes = selMinutes;
    log[sheetKey] = e;
    justRated = sheetKey;
    save();
    closeSheet();
    render();
  });

  removeBtn.addEventListener("click", () => {
    if (!sheetKey) return;
    delete log[sheetKey];
    save();
    closeSheet();
    render();
  });

  backdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
  });

  /* ---------- swipe a sheet down to dismiss ---------- */
  // Dismissing never saves: whatever was tapped in the sheet has already been
  // committed, and anything not yet committed is meant to be abandoned.
  document.querySelectorAll(".sheet").forEach((el) => {
    let startY = 0;
    let dy = 0;
    let dragging = false;

    el.addEventListener("touchstart", (e) => {
      // Don't hijack a drag that starts on the number field.
      if (e.target.closest("input")) return;
      startY = e.touches[0].clientY;
      dy = 0;
      dragging = true;
      el.classList.add("dragging");
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - startY); // downward only
      el.style.transform = `translate(-50%, ${dy}px)`;
    }, { passive: true });

    const end = () => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      el.style.transform = "";
      if (dy > 70) closeSheet();
    };
    el.addEventListener("touchend", end);
    el.addEventListener("touchcancel", end);
  });

  /* ---------- weekly goal sheet ---------- */
  const goalSheet = document.getElementById("goal-sheet");
  const goalNum = document.getElementById("goal-num");

  function setGoal(g) {
    goal = Math.min(7, Math.max(1, g));
    goalNum.textContent = goal;
    saveGoal();
    updateStats(view.getFullYear(), view.getMonth());
  }

  document.getElementById("week-card").addEventListener("click", () => {
    goalNum.textContent = goal;
    backdrop.classList.add("open");
    goalSheet.classList.add("open");
  });

  document.getElementById("goal-minus").addEventListener("click", () => setGoal(goal - 1));
  document.getElementById("goal-plus").addEventListener("click", () => setGoal(goal + 1));
  document.getElementById("goal-done").addEventListener("click", closeSheet);

  /* ---------- personal greeting ---------- */
  const nameSheet = document.getElementById("name-sheet");
  const nameInput = document.getElementById("name-input");
  const nameSkip = document.getElementById("name-skip");

  function renderGreeting() {
    const h = new Date().getHours();
    const partOfDay = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    const el = document.getElementById("greeting");
    el.textContent = name ? `${partOfDay}, ${name}` : "Zen";
    el.setAttribute("aria-label", name ? `${partOfDay}, ${name}. Change your name.` : "Set your name");
  }

  function openNameSheet(firstRun) {
    document.getElementById("name-kicker").textContent = firstRun ? "Welcome" : "Your name";
    document.getElementById("name-save").textContent = firstRun ? "Begin" : "Save";
    nameSkip.style.display = firstRun ? "block" : "none";
    nameInput.value = name;
    backdrop.classList.add("open");
    nameSheet.classList.add("open");
    setTimeout(() => nameInput.focus(), 320);
  }

  function saveName() {
    name = nameInput.value.trim().slice(0, 24);
    localStorage.setItem(NAME_KEY, name);
    renderGreeting();
    closeSheet();
  }

  document.getElementById("greeting").addEventListener("click", () => openNameSheet(false));
  document.getElementById("name-save").addEventListener("click", saveName);
  nameSkip.addEventListener("click", () => {
    localStorage.setItem(NAME_KEY, "");
    closeSheet();
  });
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveName();
  });

  /* ---------- timer ---------- */
  const timerSheet = document.getElementById("timer-sheet");
  const timerView = document.getElementById("timer-view");
  const timerTime = document.getElementById("timer-time");
  const ringFg = document.getElementById("ring-fg");
  const RING = 691.15; // circumference of the r=110 progress ring
  const MAX_RUN_MS = 6 * 3600 * 1000; // older than this is an abandoned session

  let timer = null;   // { startedAt, targetMin } — targetMin 0 means open-ended
  let tickId = null;
  let wakeLock = null;
  const bell = document.getElementById("bell");

  function fmt(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
  }

  function tick() {
    if (!timer) return;
    // Elapsed comes from the clock, never from counting intervals — a phone
    // that slept or a throttled background tab would lose time otherwise.
    const elapsed = Date.now() - timer.startedAt;
    if (timer.targetMin > 0) {
      const total = timer.targetMin * 60000;
      const left = Math.max(0, total - elapsed);
      timerTime.textContent = fmt(left);
      ringFg.style.strokeDashoffset = RING * (left / total);
      if (left <= 0) finishTimer(true);
    } else {
      timerTime.textContent = fmt(elapsed);
    }
  }

  function startTicking() {
    tick();
    clearInterval(tickId);
    tickId = setInterval(tick, 250);
  }

  function openTimerView(targetMin) {
    document.getElementById("timer-mode").textContent =
      targetMin > 0 ? `${targetMin} minute sit` : "Stopwatch";
    ringFg.classList.toggle("hidden", targetMin === 0);
    ringFg.style.strokeDashoffset = RING;
    timerView.classList.add("open");
  }

  function startTimer(targetMin) {
    timer = { startedAt: Date.now(), targetMin };
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
    closeSheet();
    openTimerView(targetMin);
    primeAudio(); // must happen inside the tap that started the timer
    requestWakeLock();
    startTicking();
  }

  function finishTimer(completed) {
    if (!timer) return;
    clearInterval(tickId);
    tickId = null;
    const elapsed = Date.now() - timer.startedAt;
    // A countdown that ran out is worth its target; anything ended early is
    // worth the time actually sat, and at least a minute.
    const minutes = completed && timer.targetMin > 0
      ? timer.targetMin
      : Math.max(1, Math.round(elapsed / 60000));
    timer = null;
    localStorage.removeItem(TIMER_KEY);
    releaseWakeLock();
    timerView.classList.remove("open");
    if (completed) chime();
    const t = new Date();
    openSheet(todayKey(), `${MONTHS[t.getMonth()]} ${t.getDate()}, ${t.getFullYear()}`, minutes);
  }

  function resumeTimer() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(TIMER_KEY)); } catch {}
    if (!saved || !saved.startedAt) return localStorage.removeItem(TIMER_KEY);
    const elapsed = Date.now() - saved.startedAt;
    if (elapsed < 0 || elapsed > MAX_RUN_MS) return localStorage.removeItem(TIMER_KEY);
    timer = saved;
    if (saved.targetMin > 0 && elapsed >= saved.targetMin * 60000) {
      // It ran out while the app was closed — treat it as completed.
      openTimerView(saved.targetMin);
      finishTimer(true);
      return;
    }
    openTimerView(saved.targetMin);
    requestWakeLock();
    startTicking();
  }

  async function requestWakeLock() {
    try {
      if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    } catch {}
  }

  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch {}
    wakeLock = null;
  }

  // iOS only lets a page play audio later if it has played some during a real
  // tap, so the bell is started and immediately rewound when the timer begins.
  function primeAudio() {
    try {
      // Play unmuted and stop immediately. Priming muted does NOT work: iOS
      // allows muted playback without a gesture, so it never unlocks audio for
      // the unprompted play at the end of the countdown. The bell opens with a
      // 30 ms fade-in, so these few milliseconds are silent anyway.
      bell.muted = false;
      bell.volume = 1;
      const p = bell.play();
      const settle = () => {
        bell.pause();
        bell.currentTime = 0;
      };
      if (p && p.then) p.then(settle).catch(settle);
      else settle();
    } catch {}
  }

  function chime() {
    try {
      bell.muted = false;
      bell.volume = 1;
      bell.currentTime = 0;
      const p = bell.play();
      if (p && p.catch) p.catch(() => {});
    } catch {}
  }

  document.getElementById("begin-btn").addEventListener("click", () => {
    backdrop.classList.add("open");
    timerSheet.classList.add("open");
  });

  document.querySelectorAll(".len").forEach((b) =>
    b.addEventListener("click", () => startTimer(Number(b.dataset.min)))
  );

  // Stopwatch is the same machinery with no target: it counts up until ended.
  document.getElementById("stopwatch-btn").addEventListener("click", () => startTimer(0));


  document.getElementById("timer-end").addEventListener("click", () => finishTimer(false));

  // Re-acquire the wake lock after the screen has been off, and re-sync the
  // display, which may be stale if the tab was throttled.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !timer) return;
    requestWakeLock();
    tick();
  });

  renderGreeting();
  // Keep the greeting honest if the app is left open across morning/evening.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) renderGreeting();
  });

  // First run: ask who this is.
  if (localStorage.getItem(NAME_KEY) === null) openNameSheet(true);

  resumeTimer();

  document.getElementById("prev").addEventListener("click", () => {
    view.setMonth(view.getMonth() - 1);
    render();
  });

  document.getElementById("next").addEventListener("click", () => {
    view.setMonth(view.getMonth() + 1);
    render();
  });

  render();

  if ("serviceWorker" in navigator) {
    // Resuming an installed app doesn't always re-navigate, so ask for an
    // update check whenever it comes back to the foreground.
    navigator.serviceWorker.register("sw.js").then((reg) => {
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) reg.update();
      });
    }).catch(() => {});

    // When a new version takes over, the page on screen is still the old one.
    // Reload it — but never in the middle of a sit, which would drop the wake
    // lock and the primed audio, so the bell would not ring.
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloading || timer) return;
      reloading = true;
      location.reload();
    });
  }

  // Ask the browser not to evict our storage under disk pressure.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }
})();
</script>
</body>
</html>
